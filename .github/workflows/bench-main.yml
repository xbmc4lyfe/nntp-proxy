# Track main-branch benchmark results with Bencher. These results are the
# baseline that pull requests are compared against (see bench-pr.yml).
# Setup: docs/development.md#continuous-benchmarking-bencher
name: Benchmarks (main)

on:
  push:
    branches:
      - main
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "scripts/bench-ci.sh"
      - ".github/workflows/bench-*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  # Debuginfo does not change the measured code; dropping it shortens linking.
  CARGO_PROFILE_BENCH_DEBUG: 0
  RUST_MIN_STACK: 8388608

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Bencher configuration
        id: check
        env:
          BENCHER_SECRET: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
        run: |
          if [ -n "$BENCHER_SECRET" ] && [ -n "$BENCHER_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Bencher is not configured (BENCHER_API_TOKEN secret or BENCHER_PROJECT variable missing); skipping benchmarks."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: Benchmarks (${{ matrix.suite }})
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write # Bencher reports results as a GitHub Check
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: divan
            adapter: json
            output: bench-divan.json
          - suite: callgrind
            adapter: rust_gungraun
            output: bench-callgrind.txt
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust-toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "Could not read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Install mold and valgrind
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          packages=(mold)
          if [ "$SUITE" = callgrind ]; then
            packages+=(valgrind)
          fi
          sudo apt-get update && sudo apt-get install -y "${packages[@]}"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: bench-${{ matrix.suite }}
          prefix-key: bench-${{ runner.os }}-rust-${{ hashFiles('rust-toolchain.toml') }}-
          cache-on-failure: true
      - name: Read gungraun version
        if: matrix.suite == 'callgrind'
        id: gungraun
        run: |
          version="$(awk '/^name = "gungraun"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [ -z "$version" ]; then
            echo "Could not read gungraun version from Cargo.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install gungraun-runner
        if: matrix.suite == 'callgrind'
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2
        with:
          tool: gungraun-runner@${{ steps.gungraun.outputs.version }}

      - name: Run benchmarks
        env:
          SUITE: ${{ matrix.suite }}
          OUTPUT: ${{ matrix.output }}
        run: bash scripts/bench-ci.sh "$SUITE" "$OUTPUT"

      - uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
      - name: Track main benchmarks with Bencher
        env:
          BENCHER_SECRET: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
          ADAPTER: ${{ matrix.adapter }}
          OUTPUT: ${{ matrix.output }}
        # Both suites set the same two Thresholds: `--thresholds-reset` drops
        # every Threshold a run does not name, so each run must name both.
        run: |
          # Accept either a current API key (bencher_*) or a legacy JWT token.
          case "$BENCHER_SECRET" in
            bencher_*) export BENCHER_API_KEY="$BENCHER_SECRET" ;;
            *) export BENCHER_API_TOKEN="$BENCHER_SECRET" ;;
          esac
          bencher run \
            --project "$BENCHER_PROJECT" \
            --branch main \
            --testbed ubuntu-latest \
            --adapter "$ADAPTER" \
            --file "$OUTPUT" \
            --threshold-measure latency \
            --threshold-test t_test \
            --threshold-min-sample-size 8 \
            --threshold-max-sample-size 64 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary 0.999 \
            --threshold-measure instructions \
            --threshold-test percentage \
            --threshold-min-sample-size 1 \
            --threshold-max-sample-size 8 \
            --threshold-lower-boundary _ \
            --threshold-upper-boundary 0.02 \
            --thresholds-reset \
            --error-on-alert \
            --ci-id "$SUITE" \
            --github-actions "$GITHUB_TOKEN"
